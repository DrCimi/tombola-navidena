<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jingle Bell · Intercambio navideño</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

@font-face{
  font-family:'AustralianMiragesCustom';
  src:url('AustralianMirages.ttf') format('truetype');
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}

:root{
  --pine:#123d32;
  --pine2:#1c604b;
  --berry:#d6344d;
  --berry-dark:#8e1b30;
  --gold:#f0c66c;
  --ink:#f4f9fc;
  --muted:#cde3f2;
  --panel:rgba(16, 54, 82, 0.76);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:#f7f5e9;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:
    url('fondo.jpg') center center / cover no-repeat fixed,
    radial-gradient(ellipse at 50% -10%,#257458 0,#144a39 52%,#0a2b23 100%);
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:rgba(7,28,22,0.22);
}
main{
  position:relative;
  max-width:860px;
  margin:auto;
  padding:22px 16px 64px;
}
.panel{
  position:relative;
  background:rgba(16, 54, 82, 0.76) !important;
  color:var(--ink);
  border:3px solid var(--gold);
  border-radius:28px;
  padding:clamp(18px,4vw,30px);
  box-shadow:0 20px 46px rgba(4,20,15,0.55),inset 0 1px rgba(255,255,255,0.24);
  margin:12px 0;
  backdrop-filter:blur(7px);
}
.hero-in-panel{
  text-align:center;
  margin-bottom:14px;
}
h1{
  font-family:'AustralianMiragesCustom','Baloo 2',cursive,sans-serif;
  font-weight:700;
  font-size:clamp(2.2rem,6vw,3.4rem);
  line-height:1.08;
  margin:4px 0 6px;
  color:#ff6b81;
  text-shadow:0 2px 10px rgba(4,16,28,0.75);
}
.subtitle{
  margin:0;
  color:#d9eefb;
  font-weight:700;
  font-size:0.95rem;
}
.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-weight:800;
  color:#fff3cf;
}
.counter{
  font-size:.85rem;
  color:#d2e7f5;
  font-weight:700;
}
.progress{
  height:11px;
  background:rgba(255,255,255,0.18);
  border-radius:20px;
  overflow:hidden;
  margin:10px 0 16px;
}
.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#34b386,#97c45d,var(--gold));
  transition:width .3s;
  border-radius:20px;
}
.controls-grid{
  display:grid;
  grid-template-columns:1.25fr 0.95fr;
  gap:14px;
  align-items:stretch;
  margin-bottom:14px;
}
.selector-label{
  display:block;
  font-size:.8rem;
  font-weight:800;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:#f7dfa0;
  margin:0 0 7px;
}
select{
  width:100%;
  padding:13px 15px;
  border:1.5px solid rgba(240,198,108,0.65);
  border-radius:14px;
  background:rgba(255,253,247,0.95);
  color:#183228;
  font:700 1rem 'Plus Jakarta Sans',sans-serif;
  outline-color:#f0c66c;
}
select:disabled{opacity:.65}
.turn-card{
  padding:12px 16px;
  border-radius:18px;
  text-align:center;
  background:linear-gradient(135deg,rgba(18,68,54,0.92),rgba(28,104,80,0.92));
  color:#fff;
  box-shadow:0 8px 18px rgba(4,20,15,0.32);
  border:2px solid var(--gold);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.turn-label{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.16em;
  color:#f3d991;
  font-weight:800;
}
.turn-name{
  font-family:'Baloo 2',cursive,sans-serif;
  font-size:clamp(1.45rem,3.8vw,1.95rem);
  font-weight:800;
  line-height:1.1;
  margin-top:2px;
}
.wheel-wrap{
  display:grid;
  place-items:center;
  position:relative;
  margin:14px auto 16px;
  width:min(76vw,330px);
  height:min(76vw,330px);
}
.pointer{
  position:absolute;
  top:-10px;
  z-index:3;
  color:var(--gold);
  font-size:38px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.7));
}
.wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:9px solid #fff9e9;
  outline:4px solid #c69a46;
  box-shadow:0 12px 28px rgba(4,20,15,0.45);
  display:grid;
  place-items:center;
  background:conic-gradient(#176348 0 25%,#b52a3e 25% 50%,#e5b955 50% 75%,#275b79 75% 100%);
  transition:transform 4s cubic-bezier(.12,.75,.15,1);
  position:relative;
}
.wheel:after{
  content:"";
  position:absolute;
  inset:10px;
  border:1px dashed #fff9e5;
  border-radius:50%;
  pointer-events:none;
}
.wheel svg{width:100%;height:100%;display:block;overflow:visible}
.wheel-label{
  font-family:"Plus Jakarta Sans",Arial,sans-serif;
  font-size:10.5px;
  font-weight:800;
  fill:#fffdf2;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:#183b2b;
  stroke-width:2.3px;
  stroke-linejoin:round;
}
.wheel-center{fill:#fff7df;stroke:#c69a46;stroke-width:5}
.wheel-center-text{font-size:25px;text-anchor:middle;dominant-baseline:middle}
.result{
  text-align:center;
  min-height:104px;
  padding:8px 6px;
